[project]
name = "kidstube-autopilot"
version = "0.1.0"
description = "Safety-first automated kids YouTube content pipeline"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"
